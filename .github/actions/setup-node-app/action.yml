name: Setup Node app
description: Node 22, npm ci, optional Prisma client generate
inputs:
  generate-prisma:
    description: Run prisma generate after install
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Generate Prisma client
      if: inputs.generate-prisma == 'true'
      shell: bash
      run: npx prisma generate
