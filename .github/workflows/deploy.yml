# Build linux/amd64 image → push ACR → update Azure Container App.
# One-time Azure bootstrap stays in scripts/azure-provision.sh.
#
# Required GitHub Actions secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variables (optional):
#   AZURE_RG, AZURE_APP_NAME, AZURE_ACR_NAME

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_RG: ${{ vars.AZURE_RG || 'rg-vihe-app' }}
  AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME || 'vihe-app' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR
        id: acr
        run: |
          set -euo pipefail
          ACR_NAME="${AZURE_ACR_NAME}"
          if [[ -z "$ACR_NAME" ]]; then
            ACR_NAME="$(az acr list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
          fi
          if [[ -z "$ACR_NAME" || "$ACR_NAME" == "None" ]]; then
            echo "::error::No ACR found. Set AZURE_ACR_NAME or run ./scripts/azure-provision.sh"
            exit 1
          fi
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ steps.acr.outputs.login_server }}/${{ env.AZURE_APP_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri_latest=${{ steps.acr.outputs.login_server }}/${{ env.AZURE_APP_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.image_uri_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Container App image
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RG" \
            --image "${{ steps.meta.outputs.image_uri }}" \
            --output none
          FQDN="$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Deployed ${{ steps.meta.outputs.image_uri }}"
          echo "URL https://${FQDN}"
