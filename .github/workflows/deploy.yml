# Build linux/amd64 image → push ACR → update Azure Container App (if present) → GitHub Release.
# One-time Azure bootstrap stays in scripts/azure-provision.sh (infra only; image via this workflow).
#
# Required GitHub Actions secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variables (optional):
#   AZURE_RG, AZURE_APP_NAME, AZURE_ACR_NAME
#
# Releases use SemVer tags (vMAJOR.MINOR.PATCH).
# - push to main → patch bump from latest v* tag (or package.json if none)
# - workflow_dispatch → choose patch / minor / major
# Azure Portal: match image tag, revision suffix, or env RELEASE_TAG / GIT_SHA.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  AZURE_RG: ${{ vars.AZURE_RG || 'rg-vihe-mumbai' }}
  AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME || 'vihe-app' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}

jobs:
  deploy:
    name: Build, push, deploy, release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR
        id: acr
        run: |
          set -euo pipefail
          ACR_NAME="${AZURE_ACR_NAME}"
          if [[ -z "$ACR_NAME" ]]; then
            ACR_NAME="$(az acr list --resource-group "$AZURE_RG" --query '[0].name' -o tsv)"
          fi
          if [[ -z "$ACR_NAME" || "$ACR_NAME" == "None" ]]; then
            echo "::error::No ACR found. Set AZURE_ACR_NAME or run ./scripts/azure-provision.sh"
            exit 1
          fi
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: meta
        run: |
          set -euo pipefail
          git fetch --tags --force

          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"

          if [[ -z "$LATEST" ]]; then
            BASE="$(node -p "require('./package.json').version")"
            # First SemVer release: ship package.json as-is (ignore bump).
            VERSION="$BASE"
            BUMP="initial"
          else
            BASE="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *)
                echo "::error::Unknown bump '$BUMP' (expected patch|minor|major)"
                exit 1
                ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASE_TAG="v${VERSION}"
          # Azure revision suffixes allow [a-z0-9-] only (max 20).
          REVISION_SUFFIX="$(echo "$RELEASE_TAG" | tr '[:upper:]' '[:lower:]' | tr '.' '-' | cut -c1-20)"
          LOGIN="${{ steps.acr.outputs.login_server }}"
          APP="${{ env.AZURE_APP_NAME }}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "release_tag=$RELEASE_TAG"
            echo "revision_suffix=$REVISION_SUFFIX"
            echo "bump=$BUMP"
            echo "image_uri=${LOGIN}/${APP}:${RELEASE_TAG}"
            echo "image_uri_sha=${LOGIN}/${APP}:sha-${SHORT_SHA}"
            echo "image_uri_latest=${LOGIN}/${APP}:latest"
          } >> "$GITHUB_OUTPUT"
          echo "Next release: ${RELEASE_TAG} (from ${LATEST:-package.json ${BASE}}, bump=${BUMP})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.image_uri_sha }}
            ${{ steps.meta.outputs.image_uri_latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.release_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Container App (if exists)
        id: app
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          if ! az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RG" >/dev/null 2>&1; then
            echo "Container App '$AZURE_APP_NAME' not in '$AZURE_RG' yet — image pushed; create app with azure-provision.sh app-update"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          az containerapp ingress update \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RG" \
            --target-port 8080 \
            --output none 2>/dev/null || true
          az containerapp update \
            --name "$AZURE_APP_NAME" \
            --resource-group "$AZURE_RG" \
            --image "${{ steps.meta.outputs.image_uri }}" \
            --revision-suffix "${{ steps.meta.outputs.revision_suffix }}" \
            --set-env-vars \
              "RELEASE_TAG=$RELEASE_TAG" \
              "GIT_SHA=$SHORT_SHA" \
              "GIT_COMMIT=${{ github.sha }}" \
              "RELEASE_URL=$RELEASE_URL" \
              "PORT=8080" \
            --output none
          FQDN="$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Deployed release $RELEASE_TAG → https://${FQDN}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BODY="$(cat <<EOF
          ## ${TAG}

          - **Version:** \`${VERSION}\`
          - **Bump:** \`${{ steps.meta.outputs.bump }}\`
          - **Commit:** [\`${{ steps.meta.outputs.short_sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - **Image:** \`${{ steps.meta.outputs.image_uri }}\`
          - **Workflow run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Container App updated:** ${{ steps.app.outputs.updated }}

          Match in Azure Portal → Container App → Revisions / env \`RELEASE_TAG\`.
          EOF
          )"
          BODY="$(printf '%s\n' "$BODY" | sed 's/^[[:space:]]*//')"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            --target "${{ github.sha }}"
