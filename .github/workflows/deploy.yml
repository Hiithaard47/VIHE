# Build linux/amd64 image → push ACR → update Azure Container App (if present) → GitHub Release.
# One-time Azure bootstrap stays in scripts/azure-provision.sh (infra only; image via this workflow).
#
# Invoked after green CI on main (see ci.yml), or manually via workflow_dispatch.
#
# Required GitHub Actions secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variables (on the production GitHub Environment):
#   AZURE_RG, AZURE_APP_NAME, AZURE_ACR_NAME
#
# Production release (SemVer vMAJOR.MINOR.PATCH) only when:
# - workflow_dispatch (manual; choose patch / minor / major), or
# - CI-called push to main with both:
#   1) a feat/fix commit (conventional), and
#   2) app runtime path changes (src/, prisma/, package.json, Dockerfile, …)
# Bump from commits: fix→patch, feat→minor, breaking (!) / BREAKING CHANGE→major.
# Azure Portal: match image tag, revision suffix, or env RELEASE_TAG / GIT_SHA.

name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to release
        type: string
        required: true
      before_sha:
        description: Previous main tip (github.event.before)
        type: string
        required: false
        default: ""
      caller_event:
        description: Originating GitHub event (push or workflow_dispatch)
        type: string
        required: false
        default: "workflow_call"
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  should-release:
    name: Gate production release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      bump: ${{ steps.gate.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Decide whether to release
        id: gate
        env:
          CALLER_EVENT: ${{ inputs.caller_event || github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump || 'patch' }}
          BEFORE_SHA: ${{ inputs.before_sha }}
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
        run: npx tsx scripts/should-release.ts

  deploy:
    name: Build, push, deploy, release
    needs: should-release
    if: needs.should-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RG: ${{ vars.AZURE_RG }}
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME || 'vihe-app' }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR
        id: acr
        run: |
          set -euo pipefail
          if [[ -z "$AZURE_RG" ]]; then
            echo "::error::Set AZURE_RG on the production environment"
            exit 1
          fi
          ACR_NAME="${AZURE_ACR_NAME}"
          if [[ -z "$ACR_NAME" ]]; then
            echo "::error::Set AZURE_ACR_NAME on the production environment"
            exit 1
          fi
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Set release metadata
        id: meta
        env:
          RELEASE_BUMP: ${{ needs.should-release.outputs.bump }}
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
        run: npx tsx scripts/next-release.ts --bump "$RELEASE_BUMP" --sha "$RELEASE_SHA" --login-server "$ACR_LOGIN_SERVER" --app "$AZURE_APP_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.image_uri_sha }}
            ${{ steps.meta.outputs.image_uri_latest }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha || github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.release_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
          TARGET: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            POINTED="$(git rev-parse "${TAG}^{commit}")"
            if [[ "$POINTED" != "$TARGET" ]]; then
              echo "::error::Tag ${TAG} already points at ${POINTED}, not ${TARGET}"
              exit 1
            fi
          else
            git tag "$TAG" "$TARGET"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Update Container App
        id: app
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          REVISION_SUFFIX: ${{ steps.meta.outputs.revision_suffix }}
          GIT_COMMIT: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          if ! az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RG" >/dev/null 2>&1; then
            echo "::error::Container App '$AZURE_APP_NAME' not in resource group '$AZURE_RG'"
            exit 1
          fi
          ./scripts/container-app-apply.sh \
            "$AZURE_APP_NAME" \
            "$AZURE_RG" \
            "$IMAGE_URI" \
            8080 \
            "$REVISION_SUFFIX" \
            "RELEASE_TAG=$RELEASE_TAG" \
            "GIT_SHA=$SHORT_SHA" \
            "GIT_COMMIT=$GIT_COMMIT" \
            "RELEASE_URL=$RELEASE_URL" \
            "PORT=8080"
          FQDN="$(az containerapp show --name "$AZURE_APP_NAME" --resource-group "$AZURE_RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Deployed release $RELEASE_TAG → https://${FQDN}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUMP: ${{ steps.meta.outputs.bump }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          UPDATED: ${{ steps.app.outputs.updated }}
          TARGET: ${{ inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          BODY="$(cat <<EOF
          ## ${TAG}

          - **Version:** \`${VERSION}\`
          - **Bump:** \`${BUMP}\`
          - **Commit:** [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${TARGET})
          - **Image:** \`${IMAGE_URI}\`
          - **Workflow run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Container App updated:** ${UPDATED}

          Match in Azure Portal → Container App → Revisions / env \`RELEASE_TAG\`.
          EOF
          )"
          BODY="$(printf '%s\n' "$BODY" | sed 's/^[[:space:]]*//')"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            --target "$TARGET"
