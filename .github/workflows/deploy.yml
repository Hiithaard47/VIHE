# Build linux/amd64 image → push ECR → roll ECS Express Mode to the new image.
# One-time AWS bootstrap (RDS/S3/ECS create) stays in scripts/aws-provision.sh.
#
# Required GitHub Actions variable:
#   AWS_ACCOUNT_ID  (12-digit) — builds role ARN arn:aws:iam::ID:role/vihe-github-actions
# Optional variables: AWS_REGION, ECR_REPOSITORY, ECS_SERVICE, AWS_ROLE_NAME
# See scripts/github-oidc-setup.sh

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'vihe-app' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'vihe-app' }}

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temporary: print OIDC claims so IAM trust `sub` can be matched exactly.
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(JSON.stringify({
              sub: payload.sub,
              aud: payload.aud,
              iss: payload.iss,
              repository: payload.repository,
              ref: payload.ref,
              environment: payload.environment,
              job_workflow_ref: payload.job_workflow_ref,
            }, null, 2))

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME || 'vihe-github-actions' }}
          role-session-name: vihe-github-actions-deploy

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_uri_latest=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.image_uri_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image-only update so existing Express Mode env (DATABASE_URL, AUTH_*, S3_*) is preserved.
      - name: Update ECS Express Mode image
        env:
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          SERVICE_NAME: ${{ env.ECS_SERVICE }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          chmod +x scripts/ecs-update-image.sh
          ./scripts/ecs-update-image.sh
