# Unit tests + sharded Playwright e2e on every PR / push to main.
# Any failing job marks the check red (require these checks to block merges).
#
# Speed notes:
# - Shared Next build artifact → shards use `next start` (no per-route compile)
# - Playwright browser cache avoids re-downloading Chromium each shard
# - DB prepare runs once per shard before Playwright (webServer only boots the app)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ChangeMe123!
  AUTH_SECRET: ci-auth-secret-not-for-production
  AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
  AZURE_STORAGE_CONTAINER: session-files
  DATABASE_URL: postgresql://vihe:vihe@localhost:5432/vihe_app?schema=public
  TEST_DATABASE_URL: postgresql://vihe:vihe@localhost:5432/vihe_app_test?schema=public
  NEXT_DIST_DIR: .next-e2e
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  e2e-build:
    name: E2E build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js for e2e
        run: npx next build
        env:
          AUTH_URL: http://localhost:3001

      # upload-artifact respects .gitignore and would skip .next-e2e.
      - name: Pack e2e build
        run: tar -czf next-e2e-build.tar.gz .next-e2e

      - name: Upload e2e build
        uses: actions/upload-artifact@v4
        with:
          name: next-e2e-build
          path: next-e2e-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vihe
          POSTGRES_PASSWORD: vihe
          POSTGRES_DB: vihe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vihe -d vihe_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Download e2e build
        uses: actions/download-artifact@v4
        with:
          name: next-e2e-build
          path: .

      - name: Unpack e2e build
        run: tar -xzf next-e2e-build.tar.gz

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for Azurite
        run: |
          for i in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/10000) >/dev/null 2>&1; then
              echo "Azurite is up"
              exit 0
            fi
            sleep 1
          done
          echo "Azurite did not become ready in time" >&2
          exit 1

      - name: Prepare e2e database
        run: npm run test:e2e:prepare

      - name: Run e2e tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true
          AUTH_URL: http://localhost:3001
          E2E_SKIP_PREPARE: "1"
          E2E_SERVER_MODE: start

  e2e-ok:
    name: E2E
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All e2e shards passed
        run: |
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "One or more e2e shards failed (${{ needs.e2e.result }})"
            exit 1
          fi
