# Unit tests + sharded Playwright e2e on every PR / push to main.
# Any failing job marks the check red (require these checks to block merges).
# Production deploy is invoked from this workflow after green CI on main.
#
# Speed notes:
# - Shared Next build artifact → shards use `next start` (no per-route compile)
# - npm, Next.js, ESLint, and Playwright caches reuse work across runs
# - DB prepare runs once per shard before Playwright (webServer only boots the app)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ChangeMe123!
  AUTH_SECRET: ci-auth-secret-not-for-production
  AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
  AZURE_STORAGE_CONTAINER: session-files
  DATABASE_URL: postgresql://vihe:vihe@localhost:5432/vihe_app?schema=public
  TEST_DATABASE_URL: postgresql://vihe:vihe@localhost:5432/vihe_app_test?schema=public
  NEXT_DIST_DIR: .next-e2e
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app

      - name: Cache ESLint and TypeScript
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
            .next-e2e/cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-
            lint-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

  e2e-build:
    name: E2E build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app
        with:
          generate-prisma: "true"

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.mjs') }}-
            nextjs-${{ runner.os }}-

      - name: Build Next.js for e2e
        run: npx next build
        env:
          AUTH_URL: http://localhost:3001

      # upload-artifact respects .gitignore and would skip .next-e2e.
      - name: Pack e2e build
        run: tar -czf next-e2e-build.tar.gz .next-e2e

      - name: Upload e2e build
        uses: actions/upload-artifact@v4
        with:
          name: next-e2e-build
          path: next-e2e-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vihe
          POSTGRES_PASSWORD: vihe
          POSTGRES_DB: vihe_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vihe -d vihe_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
        options: --health-cmd "node -e \"require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\"" --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node app
        uses: ./.github/actions/setup-node-app
        with:
          generate-prisma: "true"

      - name: Download e2e build
        uses: actions/download-artifact@v4
        with:
          name: next-e2e-build
          path: .

      - name: Unpack e2e build
        run: tar -xzf next-e2e-build.tar.gz

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Prepare e2e database
        run: npm run test:e2e:prepare

      - name: Run e2e tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true
          AUTH_URL: http://localhost:3001
          E2E_SERVER_MODE: start

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  e2e-ok:
    name: E2E
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All e2e shards passed
        run: |
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "One or more e2e shards failed (${{ needs.e2e.result }})"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [test, e2e-ok]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.e2e-ok.result == 'success'
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      sha: ${{ github.sha }}
      before_sha: ${{ github.event.before }}
      caller_event: push
