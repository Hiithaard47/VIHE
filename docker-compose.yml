services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vihe
      POSTGRES_PASSWORD: vihe
      POSTGRES_DB: vihe_app
    ports:
      - "5432:5432"
    volumes:
      - vihe-app-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vihe -d vihe_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vihe
      MINIO_ROOT_PASSWORD: vihe-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vihe-app-minio-data:/data

volumes:
  vihe-app-db-data:
  vihe-app-minio-data:
