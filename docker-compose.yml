services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vihe
      POSTGRES_PASSWORD: vihe
      POSTGRES_DB: vihe_app
    ports:
      - "5432:5432"
    volumes:
      - vihe-app-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vihe -d vihe_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose
    ports:
      - "10000:10000"
    volumes:
      - vihe-app-azurite-data:/data

volumes:
  vihe-app-db-data:
  vihe-app-azurite-data:
